services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qopcha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-qopcha}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qopcha} -d ${POSTGRES_DB:-qopcha}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://${POSTGRES_USER:-qopcha}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-qopcha}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-169-58-230-144.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-admin@qopcha.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pg_data:
  caddy_data:
  caddy_config:
