services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-169-58-230-144.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-admin@qopcha.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
