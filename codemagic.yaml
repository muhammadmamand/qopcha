# قۆپچە / Qopcha — Codemagic CI/CD (build iOS from Windows via cloud Mac)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Before first build (do this from Windows browser):
# 1. Push this repo to GitHub / GitLab / Bitbucket
# 2. Sign up at https://codemagic.io → add the app → connect the repo
# 3. App Store Connect → create app (bundle: com.qopcha.Qopcha)
# 4. Codemagic → Teams → Integrations → App Store Connect (API key .p8)
# 5. Codemagic → Code signing identities → iOS (automatic via ASC integration)
# 6. Replace APP_STORE_APPLE_ID + YOUR_EMAIL below, then start workflow "iOS TestFlight"

workflows:
  # ---------- Android APK (download from Codemagic artifacts) ----------
  android-apk:
    name: Android APK (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE: https://169-58-230-144.sslip.io
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE="$API_BASE" \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - muhammadmhassan07@gmail.com
        notify:
          success: true
          failure: true

  # ---------- iOS → TestFlight (use this from Windows) ----------
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match Apple Developer Portal key name in Codemagic
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qopcha.Qopcha
      vars:
        # Optional: App Store Connect → Qopcha → App Information → Apple ID
        # Leave 0 to start from build 1 on first TestFlight upload
        APP_STORE_APPLE_ID: "0"
        API_BASE: https://169-58-230-144.sslip.io
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Prepare Flutter and Firebase deps
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          rm -rf ~/Library/Caches/org.swift.swiftpm || true
          rm -rf ios/Pods ios/.symlinks ios/Podfile.lock || true
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA (HTTPS Contabo API)
        script: |
          if [ "$APP_STORE_APPLE_ID" != "0" ] && [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          else
            LATEST=0
          fi
          BUILD_NO=$((LATEST + 1))
          flutter build ipa --release \
            --dart-define=API_BASE="$API_BASE" \
            --build-name=1.0.$BUILD_NO \
            --build-number=$BUILD_NO \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - muhammadmhassan07@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
