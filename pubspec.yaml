name: qopcha
description: "قۆپچە - Clothing marketplace app for customers and shop owners."
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  http: ^1.6.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.2
  cloud_functions: ^6.4.0
  lottie: ^3.3.1
  liquid_glass_easy: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Patched Windows auth EventChannels + ATL-free notifications stub.
dependency_overrides:
  firebase_auth_platform_interface:
    path: packages/firebase_auth_platform_interface
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/qopcha_logo.png"
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/qopcha_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/qopcha_logo.png"
  web:
    generate: true
    image_path: "assets/images/qopcha_logo.png"
  windows:
    generate: true
    image_path: "assets/images/qopcha_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/qopcha_logo.png
    - assets/images/login_hero.png
    - assets/images/profile_wave.png
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/images/fib_logo.jpg
    - assets/images/fastpay_logo.png
    - assets/images/car.png
    - assets/images/sewing_button.png
    - assets/images/login_panel_texture.png
    - assets/images/
    - assets/images/category/t_shirt.png
    - assets/images/category/shirt.png
    - assets/images/category/shoes.png
    - assets/images/category/formal.png
    - assets/images/category/bag.png
    - assets/images/category/cap.png
    - assets/images/category/sports.png
    - assets/lottie/empty_cart.json
    - assets/lottie/order_packed.json
  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar_038.ttf
