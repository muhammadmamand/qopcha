name: shik_posh
description: "قۆپچە - Clothing marketplace app for customers and shop owners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Patched to skip Windows auth EventChannels (wrong-thread plugin bug).
dependency_overrides:
  firebase_auth_platform_interface:
    path: packages/firebase_auth_platform_interface

flutter:
  uses-material-design: true
  assets:
    - assets/images/profile_wave.png
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar_038.ttf
